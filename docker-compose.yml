version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: shoe_shop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shoe_user
      POSTGRES_PASSWORD: shoe_pass
      POSTGRES_DB: shoe_shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: shoe_shop_web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  pgdata:
