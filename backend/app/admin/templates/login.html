<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به پنل مدیریت · فروشگاه کفش</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/admin/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="fs-2"><i class="bi bi-bag-heart-fill text-primary"></i></div>
        <h4 class="fw-bold mt-2">پنل مدیریت فروشگاه کفش</h4>
        <p class="text-muted small">برای مدیریت فروشگاه وارد شوید</p>
      </div>
      {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}
      <form method="post" action="/admin/login">
        <div class="mb-3">
          <label class="form-label">ایمیل</label>
          <input type="email" name="email" class="form-control" required autofocus dir="ltr">
        </div>
        <div class="mb-3">
          <label class="form-label">رمز عبور</label>
          <input type="password" name="password" class="form-control" required dir="ltr">
        </div>
        <button type="submit" class="btn btn-brand w-100">ورود</button>
      </form>
    </div>
  </div>
</body>
</html>
