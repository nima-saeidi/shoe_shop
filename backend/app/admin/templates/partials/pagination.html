{% if pages and pages > 1 %}
<nav class="mt-3">
  <ul class="pagination pagination-sm">
    {% for p in range(1, pages + 1) %}
    <li class="page-item {% if p == page %}active{% endif %}">
      <a class="page-link" href="?page={{ p }}{% if q %}&q={{ q }}{% endif %}{% if category_filter is defined and category_filter %}&category={{ category_filter }}{% endif %}{% if level_filter is defined and level_filter %}&level={{ level_filter }}{% endif %}{% if date_from is defined and date_from %}&date_from={{ date_from }}{% endif %}{% if date_to is defined and date_to %}&date_to={{ date_to }}{% endif %}">{{ p }}</a>
    </li>
    {% endfor %}
  </ul>
</nav>
{% endif %}
