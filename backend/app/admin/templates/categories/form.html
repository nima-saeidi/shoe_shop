{% extends "base.html" %}
{% block title %}{{ "ویرایش" if category else "دسته‌بندی جدید" }}{% endblock %}
{% block page_title %}{{ "ویرایش دسته‌بندی" if category else "دسته‌بندی جدید" }}{% endblock %}
{% block content %}
<div class="panel" style="max-width: 640px;">
  <form method="post" action="{{ '/admin/categories/' ~ category.id ~ '/edit' if category else '/admin/categories/new' }}">
    <div class="mb-3">
      <label class="form-label">نام دسته‌بندی</label>
      <input type="text" name="name" class="form-control" value="{{ category.name if category else '' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">توضیحات</label>
      <textarea name="description" class="form-control" rows="3">{{ category.description if category else '' }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">دسته‌بندی والد</label>
      <select name="parent_id" class="form-select">
        <option value="">— بدون والد —</option>
        {% for c in all_categories %}
        <option value="{{ c.id }}" {% if category and category.parent_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" name="is_active" value="true" id="isActive" {% if not category or category.is_active %}checked{% endif %}>
      <label class="form-check-label" for="isActive">فعال</label>
    </div>
    <button type="submit" class="btn btn-brand">ذخیره</button>
    <a href="/admin/categories" class="btn btn-light">انصراف</a>
  </form>
</div>
{% endblock %}
