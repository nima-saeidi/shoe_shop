{% extends "base.html" %}
{% block title %}کد تخفیف جدید{% endblock %}
{% block page_title %}کد تخفیف جدید{% endblock %}
{% block content %}
<div class="panel" style="max-width: 640px;">
  <form method="post" action="/admin/coupons/new">
    <div class="mb-3">
      <label class="form-label">کد تخفیف</label>
      <input type="text" name="code" class="form-control text-uppercase" dir="ltr" required>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">نوع تخفیف</label>
        <select name="discount_type" class="form-select">
          <option value="percent">درصدی</option>
          <option value="fixed">مبلغ ثابت</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">مقدار تخفیف</label>
        <input type="number" step="0.01" name="discount_value" class="form-control" required>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">حداقل مبلغ سفارش (تومان)</label>
        <input type="number" step="0.01" name="min_order_amount" class="form-control" value="0">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">حداکثر تعداد استفاده</label>
        <input type="number" name="max_uses" class="form-control">
      </div>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">تاریخ شروع اعتبار</label>
        <input type="datetime-local" name="valid_from" class="form-control">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">تاریخ پایان اعتبار</label>
        <input type="datetime-local" name="valid_until" class="form-control">
      </div>
    </div>
    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" name="is_active" value="true" id="isActive" checked>
      <label class="form-check-label" for="isActive">فعال</label>
    </div>
    <button type="submit" class="btn btn-brand">ذخیره</button>
    <a href="/admin/coupons" class="btn btn-light">انصراف</a>
  </form>
</div>
{% endblock %}
