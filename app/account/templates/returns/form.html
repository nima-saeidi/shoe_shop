{% extends "base.html" %}
{% block title %}درخواست مرجوعی{% endblock %}
{% block page_title %}درخواست مرجوعی{% endblock %}
{% block content %}
<div class="panel" style="max-width: 640px;">
  <div class="border rounded-3 p-3 mb-3 bg-light">
    <div class="fw-semibold">{{ order_item.product_name }}</div>
    <div class="text-muted small">سایز {{ order_item.size }} — رنگ {{ order_item.color }} — تعداد {{ order_item.quantity }}</div>
  </div>
  <form method="post" action="/account/returns/new">
    <input type="hidden" name="order_item_id" value="{{ order_item.id }}">
    <div class="mb-3">
      <label class="form-label">دلیل مرجوعی</label>
      <select name="reason" class="form-select" required>
        <option value="wrong_size">سایز نامناسب</option>
        <option value="defective">معیوب / آسیب‌دیده</option>
        <option value="not_as_described">عدم تطابق با توضیحات</option>
        <option value="changed_mind">انصراف از خرید</option>
        <option value="other">سایر موارد</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">توضیحات (اختیاری)</label>
      <textarea name="description" class="form-control" rows="3" placeholder="توضیح بیشتری درباره دلیل مرجوعی بنویسید..."></textarea>
    </div>
    <button type="submit" class="btn btn-brand">ثبت درخواست</button>
    <a href="/account/orders/{{ order_item.order_id }}" class="btn btn-light">انصراف</a>
  </form>
</div>
{% endblock %}
