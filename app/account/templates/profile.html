{% extends "base.html" %}
{% block title %}پروفایل{% endblock %}
{% block page_title %}پروفایل و امنیت حساب{% endblock %}
{% block content %}
<div class="row g-3">
  <div class="col-lg-6">
    <div class="panel">
      <h5 class="mb-3">اطلاعات حساب</h5>
      <form method="post" action="/account/profile">
        <div class="mb-3">
          <label class="form-label">نام و نام خانوادگی</label>
          <input type="text" name="full_name" class="form-control" value="{{ current_customer.full_name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">ایمیل</label>
          <input type="email" class="form-control" value="{{ current_customer.email }}" dir="ltr" disabled>
          <div class="form-text">تغییر ایمیل از این بخش امکان‌پذیر نیست.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">شماره موبایل</label>
          <input type="text" name="phone_number" class="form-control" dir="ltr" value="{{ current_customer.phone_number or '' }}">
        </div>
        <button type="submit" class="btn btn-brand">ذخیره تغییرات</button>
      </form>
    </div>
  </div>

  <div class="col-lg-6">
    <div class="panel">
      <h5 class="mb-3">تغییر رمز عبور</h5>
      <form method="post" action="/account/profile/password">
        <div class="mb-3">
          <label class="form-label">رمز عبور فعلی</label>
          <input type="password" name="current_password" class="form-control" dir="ltr" required>
        </div>
        <div class="mb-3">
          <label class="form-label">رمز عبور جدید</label>
          <input type="password" name="new_password" class="form-control" dir="ltr" required minlength="8">
          <div class="form-text">حداقل ۸ کاراکتر</div>
        </div>
        <button type="submit" class="btn btn-brand">تغییر رمز عبور</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
