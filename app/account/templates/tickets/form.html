{% extends "base.html" %}
{% block title %}تیکت جدید{% endblock %}
{% block page_title %}تیکت پشتیبانی جدید{% endblock %}
{% block content %}
<div class="panel" style="max-width: 640px;">
  <form method="post" action="/account/tickets/new">
    <div class="mb-3">
      <label class="form-label">موضوع</label>
      <input type="text" name="subject" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">پیام</label>
      <textarea name="message" class="form-control" rows="5" required></textarea>
    </div>
    <button type="submit" class="btn btn-brand">ارسال تیکت</button>
    <a href="/account/tickets" class="btn btn-light">انصراف</a>
  </form>
</div>
{% endblock %}
