<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت‌نام · فروشگاه کفش</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/account/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="fs-2"><i class="bi bi-bag-heart-fill text-success"></i></div>
        <h4 class="fw-bold mt-2">ساخت حساب کاربری</h4>
        <p class="text-muted small">فروشگاه کفش</p>
      </div>
      {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}
      <form method="post" action="/account/register">
        <div class="mb-3">
          <label class="form-label">نام و نام خانوادگی</label>
          <input type="text" name="full_name" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">ایمیل</label>
          <input type="email" name="email" class="form-control" required dir="ltr">
        </div>
        <div class="mb-3">
          <label class="form-label">شماره موبایل (اختیاری)</label>
          <input type="text" name="phone_number" class="form-control" dir="ltr">
        </div>
        <div class="mb-3">
          <label class="form-label">رمز عبور</label>
          <input type="password" name="password" class="form-control" required minlength="8" dir="ltr">
          <div class="form-text">حداقل ۸ کاراکتر</div>
        </div>
        <button type="submit" class="btn btn-brand w-100">ثبت‌نام</button>
      </form>
      <p class="text-center small text-muted mt-3 mb-0">
        قبلاً ثبت‌نام کرده‌اید؟ <a href="/account/login">وارد شوید</a>
      </p>
    </div>
  </div>
</body>
</html>
